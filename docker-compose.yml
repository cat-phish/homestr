# HomeStr local development stack: MariaDB + C++ hub + Vite WebUI.
#
#   cp .env.example .env && docker compose up --build
#
# Both application services bind-mount their sources, so edits on the host are
# picked up without rebuilding the image: Vite hot-reloads, and the backend
# recompiles on `docker compose restart backend`.
#
# Nothing here is machine-specific. Everything that differs between developers
# and between platforms is an environment variable with a default, so the only
# file anyone edits is their own untracked .env:
#   * published host ports        -- *_PUBLISHED_PORT
#   * SELinux bind-mount labels   -- VOLUME_SUFFIX
#   * container and volume names  -- COMPOSE_PROJECT_NAME
#
# Container names are deliberately not pinned: a fixed container_name makes two
# checkouts (or two worktrees, or two developers on one host) collide. Compose
# derives names from the project instead, so overriding COMPOSE_PROJECT_NAME
# gives a fully independent stack.
name: homestr

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-homestr_dev_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-homestr_db}
      MARIADB_USER: ${MARIADB_USER:-homestr_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-homestr_dev_pw}
    ports:
      # Exposed for local tooling only; the services talk over the compose
      # network. Change DB_PUBLISHED_PORT if a local MariaDB/MySQL holds 3306.
      - '${DB_PUBLISHED_PORT:-3306}:3306'
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, on an empty data directory. `docker compose down -v` to
      # re-seed after editing the schema.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro${VOLUME_SUFFIX:-}
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - homestr

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-homestr_db}
      MARIADB_USER: ${MARIADB_USER:-homestr_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-homestr_dev_pw}
      # Port inside the container. Kept fixed so the frontend proxy and the
      # nginx config can rely on backend:8080; publish elsewhere instead.
      HOMESTR_HTTP_PORT: 8080
      HOMESTR_LOG_LEVEL: ${HOMESTR_LOG_LEVEL:-debug}
      HOMESTR_BUILD_TYPE: ${HOMESTR_BUILD_TYPE:-Debug}
      HOMESTR_RUN_TESTS: ${HOMESTR_RUN_TESTS:-0}
    ports:
      - '${HOMESTR_PUBLISHED_PORT:-8080}:8080'
    volumes:
      - ./backend:/app:rw${VOLUME_SUFFIX:-}
      # Do not mount ./.clang-format in here: Docker creates the missing mount
      # target, leaving an empty backend/.clang-format in the repo, and an
      # empty config silently reverts clang-format to LLVM defaults. Run the
      # formatter from the repo root instead.
      #
      # Keeps the CMake cache and the FetchContent downloads out of the host
      # tree and across restarts.
      - backend-build:/app/build
    networks:
      - homestr

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Dev requests go through the Vite proxy, which forwards to the hub over
      # the compose network, so the browser needs no backend origin.
      VITE_PROXY_TARGET: http://backend:8080
      # Port inside the container; read by vite.config.ts.
      FRONTEND_PORT: 5173
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${FRONTEND_PUBLISHED_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app:rw${VOLUME_SUFFIX:-}
      # Named volume: keeps the container's node_modules from being shadowed by
      # the host bind mount, and keeps Linux-built binaries off a macOS host.
      - frontend-node-modules:/app/node_modules
    networks:
      - homestr

volumes:
  db-data:
  backend-build:
  frontend-node-modules:

networks:
  homestr:
    driver: bridge
